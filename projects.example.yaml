# Project registry schema. Copy to projects.yaml (gitignored) and fill in real entries.
# Override location with AGENTIC_OS_PROJECTS=/path/to/projects.yaml
#
# Fields (anything else is an error):
#   path              absolute or ~-relative git repo root (required)
#   verify            shell command run in the ticket's worktree; exit 0 = pass (required)
#                     {root} expands to the main checkout (for tools that live only there,
#                     e.g. {root}/.venv/bin/python); {base} expands to the run's base commit.
#                     Any file the command names must be committed at HEAD.
#   verify_timeout_s  verify timeout in seconds (default 600)
#   kind              free text: r-shiny | python | wiki | ...
#   env               extra env for verify and dispatch; PATH is prepended, never replaced
#   seed              gitignored paths (relative, no '..') copied into each fresh worktree,
#                     links dereferenced; each must be ignored by a committed .gitignore
#   confidential      true => agents run sandboxed and only template comments reach Linear
#   no_push           true => the dispatch prompt forbids push/deploy
#   note              free text shown in the dashboard (the dashboard rewrites this file and
#                     drops # comments, so keep remarks here)
#
# The dashboard's Projects panel can add, edit and remove entries (it validates them first).
projects:
  example-r-app:
    path: ~/code/example-r-app
    kind: r-shiny
    verify: Rscript tests/testthat.R
    verify_timeout_s: 900
    env:
      PATH: ~/miniforge3/bin
    seed:
      - data/fixtures
    confidential: true
    no_push: true
    note: laptop only; tests need the miniforge R
  example-py-tool:
    path: ~/code/example-py-tool
    kind: python
    verify: "{root}/.venv/bin/python -m pytest -q"
    confidential: false
    no_push: false
